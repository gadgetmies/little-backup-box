name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pages-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy-main:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        working-directory: webapp
        run: npm ci

      - name: Determine base path
        id: base_path
        run: |
          REPO_NAME="${{ github.repository }}"
          REPO_NAME_ONLY="${REPO_NAME#*/}"
          OWNER_NAME="${REPO_NAME%%/*}"

          if [ "$REPO_NAME_ONLY" = "${OWNER_NAME}.github.io" ]; then
            BASE_PATH="/"
          else
            BASE_PATH="/${REPO_NAME_ONLY}/"
          fi

          echo "base_path=${BASE_PATH}" >> "$GITHUB_OUTPUT"

      - name: Build static version
        working-directory: webapp
        run: npm run build:static
        env:
          VITE_USE_MOCK_API: 'true'
          VITE_BASE_PATH: ${{ steps.base_path.outputs.base_path }}

      - name: Deploy main site to gh-pages root
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: webapp/dist
          clean: true
          clean-exclude: |
            pr-*

  deploy-pr-preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        working-directory: webapp
        run: npm ci

      - name: Determine PR preview base path and URL
        id: preview
        run: |
          REPO_NAME="${{ github.repository }}"
          REPO_NAME_ONLY="${REPO_NAME#*/}"
          OWNER_NAME="${REPO_NAME%%/*}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PREVIEW_DIR="pr-${PR_NUMBER}"

          if [ "$REPO_NAME_ONLY" = "${OWNER_NAME}.github.io" ]; then
            BASE_PATH="/${PREVIEW_DIR}/"
            PREVIEW_URL="https://${OWNER_NAME}.github.io/${PREVIEW_DIR}/"
          else
            BASE_PATH="/${REPO_NAME_ONLY}/${PREVIEW_DIR}/"
            PREVIEW_URL="https://${OWNER_NAME}.github.io/${REPO_NAME_ONLY}/${PREVIEW_DIR}/"
          fi

          echo "preview_dir=${PREVIEW_DIR}" >> "$GITHUB_OUTPUT"
          echo "base_path=${BASE_PATH}" >> "$GITHUB_OUTPUT"
          echo "preview_url=${PREVIEW_URL}" >> "$GITHUB_OUTPUT"

      - name: Build static version for PR preview
        working-directory: webapp
        run: npm run build:static
        env:
          VITE_USE_MOCK_API: 'true'
          VITE_BASE_PATH: ${{ steps.preview.outputs.base_path }}

      - name: Deploy PR preview to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: webapp/dist
          target-folder: ${{ steps.preview.outputs.preview_dir }}
          clean: true

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = '${{ steps.preview.outputs.preview_url }}';
            const body = `Preview ready: ${previewUrl}`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const botComment = comments.find((comment) =>
              comment.user.type === 'Bot' && comment.body.includes('Preview ready:')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

  cleanup-pr-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Remove PR preview directory
        id: cleanup
        run: |
          if ! git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            echo "removed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch origin gh-pages:gh-pages
          git checkout gh-pages

          PREVIEW_DIR="pr-${{ github.event.pull_request.number }}"

          if [ -d "$PREVIEW_DIR" ]; then
            rm -rf "$PREVIEW_DIR"
            echo "removed=true" >> "$GITHUB_OUTPUT"
          else
            echo "removed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push cleanup
        if: steps.cleanup.outputs.removed == 'true'
        run: |
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore: remove PR preview for #${{ github.event.pull_request.number }}"
          git push origin gh-pages

