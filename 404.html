<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Little Backup Box</title>
  <script>
    // /little-backup-box/ is replaced at build time with VITE_BASE_PATH (e.g. "/little-backup-box/pr-144/").
    // When unreplaced (dev/local 404), fall back to "/" which works for `npm run dev` and root-served builds.
    var basePath = '/little-backup-box/';
    if (basePath === '__' + 'BASE_PATH__' || !basePath) {
      basePath = '/';
    }
    if (basePath.charAt(basePath.length - 1) !== '/') {
      basePath = basePath + '/';
    }

    var path = window.location.pathname;
    var search = window.location.search;
    var hash = window.location.hash;

    var redirectPath = path;
    if (path.indexOf(basePath) === 0) {
      var subPath = path.slice(basePath.length);
      redirectPath = subPath ? '/' + subPath.replace(/^\/+/, '') : '/';
    }

    var redirectQuery = '';
    if (redirectPath && redirectPath !== '/' && redirectPath !== '/index.html') {
      redirectQuery = '?redirect=' + encodeURIComponent(redirectPath);
    }

    var newPath = basePath + 'index.html' + redirectQuery + (search ? (redirectQuery ? '&' + search.slice(1) : search) : '') + hash;
    window.location.replace(newPath);
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
